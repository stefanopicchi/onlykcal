async function pdfText(buf){

  const bm=e.target.closest('[data-bm]');
  if(bm){toggleM(bm.dataset.bm);return}
  const b=e.target.closest('button');if(!b)return;const D=b.dataset;
  if(b.id!=='ra')delArm=false;
  if(!D.ex)pending=null;
  if(b.id==='theme'){toggleTheme();return}
  if(b.id==='menu'){document.body.classList.add('dopen');return}
  if(b.id==='dclose'){document.body.classList.remove('dopen');return}
  if(D.tab){tab=D.tab;sheetTx=null}
  else if(D.py){const ys=[...new Set(months().map(m=>m.slice(0,4)))].sort();py=ys[Math.min(ys.length-1,Math.max(0,ys.indexOf(py)+ +D.py))];const y=scrollY;render();scrollTo(0,y);return}
  else if(D.m){toggleM(D.m);return}
  else if(D.all){sel=months().filter(m=>D.all==='all'||m.startsWith(py)).sort();selCat='';const y=scrollY;render();scrollTo(0,y);return}
  else if(D.sheet){sheetTx=D.sheet;render();return}
  else if(D.sclose){sheetTx=null;render();return}
  else if(D.pick!==undefined){const x=S.tx.find(y=>String(y.id)===String(sheetTx));if(x)applyCat(x,D.pick);sheetTx=null;const y=scrollY;render();scrollTo(0,y);return}
  else if(D.clearcat){selCat='';const y=scrollY;render();scrollTo(0,y);return}
  else if(D.ren){renaming=D.ren;const y=scrollY;render();scrollTo(0,y);setTimeout(()=>{const i=$('#rn');if(i&&i.focus){i.focus();if(i.select)i.select()}},0);return}
  else if(D.rnok){doRename();return}
  else if(D.rnx){renaming=null;const y=scrollY;render();scrollTo(0,y);return}
  else if(D.ex){
    const x=S.tx.find(y=>String(y.id)===D.ex);if(!x)return;
    const k=key(x.desc);pending=null;
    if(!x.ex){
      x.ex=true;
      if(k&&!S.excl[k]){const ids=S.tx.filter(y=>y!==x&&!y.ex&&key(y.desc)===k).map(y=>y.id);S.excl[k]=1;ids.forEach(id=>{S.tx.find(z=>z.id===id).ex=true});pending={id:x.id,type:'ex',k,ids,on:true}}
    }else{
      x.ex=false;
      if(k&&S.excl[k]){delete S.excl[k];S.tx.forEach(y=>{if(key(y.desc)===k)y.ex=false})}
    }
    save();const y=scrollY;render();scrollTo(0,y);return}
  else if(D.del){S.tx=S.tx.filter(x=>String(x.id)!==D.del);save();const y=scrollY;render();scrollTo(0,y);return}
  else if(D.rmc){S.cats=S.cats.filter(c=>c!==D.rmc);S.tx.forEach(x=>{if(x.cat===D.rmc)x.cat=''});for(const k in S.rules)if(S.rules[k]===D.rmc)delete S.rules[k];save()}
  else if(b.id==='addc'){const v=$('#nc').value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);save()}}
  else if(b.id==='rr'){S.rules={};S.excl={};save()}
  else if(b.id==='ra'){if(!delArm){delArm=true;msg='Tocca di nuovo “Cancella tutti i dati” per confermare.'}else{delArm=false;S.tx=[];S.excl={};save();msg='Dati cancellati.'}}
  else if(b.id==='bk'){exportBackup();return}
  else return;
  render();window.scrollTo(0,0);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pchk'&&pending){
    const p=pending,fd=id=>S.tx.find(z=>z.id===id);p.on=t.checked;
    if(p.type==='cat'){
      if(p.on){S.rules[p.k]=p.v;p.ids.forEach(id=>{const y=fd(id);if(y)y.cat=p.v})}
      else{if(p.prev)S.rules[p.k]=p.prev;else delete S.rules[p.k];p.ids.forEach(id=>{const y=fd(id);if(y&&y.cat===p.v)y.cat=''})}
    }else{
      if(p.on){S.excl[p.k]=1;p.ids.forEach(id=>{const y=fd(id);if(y)y.ex=true})}
      else{delete S.excl[p.k];p.ids.forEach(id=>{const y=fd(id);if(y)y.ex=false})}
    }
    save();const y=scrollY;render();scrollTo(0,y);return}
  if(t.id==='file'){const f=t.files[0];if(!f)return;
    (async()=>{try{const l=await readFile(f);const n=addTx(l);msg=l.length?`Importate ${n} spese (${l.length-n} già presenti).`:'Non ho riconosciuto movimenti in questo file. Prova con un altro formato (PDF, Excel o CSV).';if(l.length)tab='mese'}catch(err){msg='Non riesco a leggere il file.'}t.value='';render()})();return}
  if(t.id==='rf'){const f=t.files[0];if(!f)return;
    (async()=>{try{const j=JSON.parse(await f.text());const B=j.S||j;let n=0;const ids=new Set(S.tx.map(x=>x.id));
      (B.tx||[]).forEach(x=>{if(x&&x.date&&x.amt>0&&!ids.has(x.id)){S.tx.push(x);ids.add(x.id);n++}});
      (B.cats||[]).forEach(c=>{if(!S.cats.includes(c))S.cats.push(c)});
      for(const k in(B.rules||{}))if(!(k in S.rules))S.rules[k]=B.rules[k];
      for(const k in(B.excl||{}))S.excl[k]=1;
      save();msg=`Backup ripristinato: ${n} spese aggiunte.`;tab='mese';sel=null}catch(err){msg='File di backup non valido.'}t.value='';render()})();return}
});
render();
applyTheme();
initCloud();
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script></body></html>
